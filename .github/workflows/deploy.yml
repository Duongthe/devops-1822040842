name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code từ repository
        uses: actions/checkout@v4
        
      - name: Kiểm tra số lượng file (index, style, script)
        run: |
          if [ ! -f "index.html" ] || [ ! -f "style.css" ] || [ ! -f "script.js" ]; then
            echo "Lỗi: Thiếu ít nhất 1 trong 3 file cơ bản!"
            exit 1
          fi
          
      - name: Kiểm tra thẻ <title> trong index.html
        run: |
          if ! grep -q "<title>.*</title>" index.html; then
            echo "Lỗi: File index.html không chứa thẻ <title>!"
            exit 1
          fi
          echo "Pass: File đầy đủ và hợp lệ."

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4